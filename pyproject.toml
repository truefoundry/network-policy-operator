[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfy-netpol-operator"
version = "0.6.0"
description = "TrueFoundry annotation-driven NetworkPolicy operator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kopf>=1.37,<2",
    "kubernetes>=29,<31",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
