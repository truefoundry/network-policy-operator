image:
  repository: tfy.jfrog.io/tfy-images/tfy-netpol-operator
  tag: "0.6.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Single active replica (operator runs with --standalone). For HA, enable Kopf
# peering in the image entrypoint and raise this.
replicaCount: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# On `helm uninstall`, run a post-delete hook Job that deletes every
# NetworkPolicy the operator created (label
# app.kubernetes.io/managed-by=tfy-netpol-operator) across all namespaces.
# Set to false to keep the policies in place after uninstalling the operator.
cleanupOnUninstall: true

# ---- Operator behavior (rendered into the ConfigMap) ------------------------
config:
  # Start in report-only mode. Set to false to enforce.
  dryRun: true
  # Reject the "*" wildcard (allow-all-namespaces) by default.
  allowWildcard: false
  # Create the explicit default-deny-ingress backstop policy in managed namespaces.
  # Disable only if you intend to rely on the allow-ingress policy alone for isolation.
  defaultDenyIngress: true
  resyncIntervalSeconds: 300
  # Always-allowed ingress sources injected into every managed namespace so an
  # empty/incomplete annotation cannot black-hole a namespace. Tune per cluster.
  baselineAllowedNamespaces: []
    # - ingress-nginx        # or istio-ingress / openshift-ingress
    # - prometheus
    # - tfy-agent
  # Extra namespaces the operator must never touch (kube-*/openshift-* already excluded).
  denylist: []
    # - tfy-system
  # Optional ipBlock CIDRs injected into the allow-ingress policy (node/hostNetwork edge cases).
  nodeCIDRs: []
    # - 10.0.0.0/16
